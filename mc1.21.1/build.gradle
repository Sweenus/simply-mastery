plugins {
    id 'dev.architectury.loom' version '1.13.469' apply false
    id 'architectury-plugin' version '3.4.164'
    id 'com.gradleup.shadow' version '8.3.11' apply false
}

architectury {
    minecraft = project.minecraft_version
}

def suiteRoot = rootDir.parentFile.parentFile

ext {
    simplySwordsCommonJar = file("${suiteRoot}/SimplySwords/common/build/devlibs/simplyswords-common-${simply_swords_version}-1.21.1-dev.jar")
    simplySwordsFabricJar = file("${suiteRoot}/SimplySwords/fabric/build/libs/simplyswords-fabric-${simply_swords_version}-1.21.1.jar")
    simplySwordsNeoForgeJar = file("${suiteRoot}/SimplySwords/forge/build/libs/simplyswords-forge-${simply_swords_version}-1.21.1.jar")
    simplyTooltipsCommonJar = file("${suiteRoot}/simplytooltips/common/build/devlibs/SimplyTooltips-common-0.1.5-dev.jar")
    simplyTooltipsFabricJar = file("${suiteRoot}/simplytooltips/fabric/build/libs/SimplyTooltips-fabric-0.1.5.jar")
    simplyTooltipsNeoForgeJar = file("${suiteRoot}/simplytooltips/neoforge/build/libs/SimplyTooltips-neoforge-0.1.5.jar")
}

allprojects {
    group = rootProject.maven_group
    version = rootProject.mod_version
}

subprojects {
    apply plugin: 'dev.architectury.loom'
    apply plugin: 'architectury-plugin'
    apply plugin: 'maven-publish'

    base {
        archivesName = "$rootProject.archives_name-$project.name"
    }

    repositories {
        maven {
            name = 'CurseMaven'
            url = 'https://www.cursemaven.com'
            content { includeGroup 'curse.maven' }
        }
        maven {
            name = 'FzzyMaven'
            url = 'https://maven.fzzyhmstrs.me/'
        }
        maven {
            name = 'KotlinForForge'
            url = 'https://thedarkcolour.github.io/KotlinForForge/'
        }
        maven {
            name = 'NeoForged'
            url = 'https://maven.neoforged.net/releases'
        }
        maven { url = 'https://jitpack.io' }
    }

    dependencies {
        minecraft "net.minecraft:minecraft:$rootProject.minecraft_version"
        mappings loom.layered {
            it.mappings("net.fabricmc:yarn:$rootProject.yarn_mappings:v2")
            it.mappings("dev.architectury:yarn-mappings-patch-neoforge:$rootProject.yarn_mappings_patch_neoforge_version")
        }
    }

    java {
        withSourcesJar()
        sourceCompatibility = JavaVersion.VERSION_21
        targetCompatibility = JavaVersion.VERSION_21
    }

    tasks.withType(JavaCompile).configureEach {
        options.release = 21
    }

    tasks.named('check').configure {
        dependsOn rootProject.tasks.named('verifyDependencyPins')
    }
}

tasks.register('verifyDependencyPins') {
    doLast {
        ['simply_swords_fabric_file_id', 'simply_swords_neoforge_file_id',
         'simply_tooltips_fabric_file_id', 'simply_tooltips_neoforge_file_id'].each { key ->
            def value = providers.gradleProperty(key).orNull
            if (value == null || !(value ==~ /\d+/)) {
                throw new GradleException("Invalid dependency pin: $key")
            }
        }
        [simplySwordsCommonJar, simplySwordsFabricJar, simplySwordsNeoForgeJar,
         simplyTooltipsCommonJar, simplyTooltipsFabricJar, simplyTooltipsNeoForgeJar].each { artifact ->
            if (!artifact.isFile()) {
                throw new GradleException("Missing local development artifact: $artifact")
            }
        }
    }
}
