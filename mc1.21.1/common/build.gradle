architectury {
    common rootProject.enabled_platforms.split(',')
}

sourceSets.main.resources.srcDir(rootProject.file('../shared-resources'))

dependencies {
    modImplementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    modImplementation "dev.architectury:architectury:${rootProject.architectury_api_version}"
    modImplementation "me.fzzyhmstrs:fzzy_config:${rootProject.fzz_config_version}"
    modCompileOnly files(rootProject.simplySwordsCommonJar)
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly files(rootProject.simplySwordsCommonJar)
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
}
