plugins {
    id 'com.gradleup.shadow'
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

sourceSets {
    coverageTest {
        compileClasspath += sourceSets.main.output + configurations.compileClasspath
        runtimeClasspath += output + sourceSets.main.output + configurations.runtimeClasspath
    }
}

loom {
    createRemapConfigurations(sourceSets.coverageTest)
    mods {
        simplymastery_coverage_test {
            sourceSet sourceSets.coverageTest
        }
    }
    runs {
        coverageServer {
            environment "gametestserver"
            forgeTemplate "gameTestServer"
            source sourceSets.main
            source sourceSets.coverageTest
            vmArg "-Dneoforge.enabledGameTestNamespaces=simplymastery_coverage_test"
            vmArg "-Dsimplymastery.coverageAudit=true"
            runDir "build/coverage-gametest"
        }
    }
}

configurations {
    common
    shadowCommon
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common
}

dependencies {
    neoForge "net.neoforged:neoforge:${rootProject.neoforge_version}"
    modImplementation "dev.architectury:architectury-neoforge:${rootProject.architectury_api_version}"
    modImplementation("me.fzzyhmstrs:fzzy_config:${rootProject.fzz_config_version}+neoforge") {
        exclude group: 'net.neoforged.fancymodloader', module: 'loader'
    }
    modImplementation files(rootProject.simplySwordsNeoForgeJar)
    modRuntimeOnly files(rootProject.simplyTooltipsNeoForgeJar)
    modRuntimeOnly 'com.github.ZsoltMolnarrr:TinyConfig:2.3.2'
    forgeRuntimeLibrary 'org.jetbrains.kotlin:kotlin-stdlib:2.1.0'
    forgeRuntimeLibrary 'org.jetbrains.kotlin:kotlin-reflect:2.0.20'
    forgeRuntimeLibrary 'blue.endless:jankson:1.2.3'
    forgeRuntimeLibrary 'net.peanuuutz.tomlkt:tomlkt-jvm:0.3.7'

    common(project(path: ':common', configuration: 'namedElements')) { transitive false }
    shadowCommon(project(path: ':common', configuration: 'transformProductionNeoForge')) { transitive false }
}

processResources {
    inputs.property 'version', project.version
    filesMatching('META-INF/neoforge.mods.toml') {
        expand version: project.version
    }
}

shadowJar {
    exclude 'fabric.mod.json'
    exclude 'architectury.common.json'
    configurations = [project.configurations.shadowCommon]
    archiveClassifier.set('dev-shadow')
}

remapJar {
    inputFile.set shadowJar.archiveFile
    dependsOn shadowJar
    archiveClassifier.set(null)
}

jar {
    archiveClassifier.set('dev')
}
